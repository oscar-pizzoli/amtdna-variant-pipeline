name: adna_qc
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Core Language & Interpreters
  - python=3.12
  - perl
  - r-base

  # Bioinformatic Tools (Blocks 1 -> 7)
  - bwa
  - samtools
  - bcftools
  - bedtools
  - mafft
  - adapterremoval=2.3.3
  - mapdamage2
  - pmdtools
  - haplogrep3              # Essenziale per il Blocco 7
  - multiqc
  - sra-tools

  # Python Libraries & Bindings
  - pysam
  - scipy
  - pyyaml
  - typeguard
  - pytest
  - pip

  # System Utilities & Build Essentials
  - parallel
  - gawk
  - make
  - cmake
  - gcc_linux-64
  - gxx_linux-64