name: adna_qc
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ----------------------------------------------------------------------------
  # Core Runtimes & Interpreters
  # ----------------------------------------------------------------------------
  - python=3.12.3
  - pip=26.2.1
  - openjdk=22.0.1
  - perl=5.32.1
  - r-base=4.3.3

  # ----------------------------------------------------------------------------
  # Block 1 - 7: Bioinformatics Engines (Bioconda)
  # ----------------------------------------------------------------------------
  - bwa=0.7.18
  - samtools=1.21
  - bcftools=1.21
  - bedtools=2.31.1
  - htslib=1.21
  - adapterremoval=2.3.3
  - mapdamage2=2.2.2
  - pmdtools=0.60
  - haplogrep3=3.2.2
  - mafft=7.525
  - seqtk=1.4
  - multiqc=1.35

  # ----------------------------------------------------------------------------
  # R Dependencies (Required for mapDamage2 Bayesian statistical models)
  # ----------------------------------------------------------------------------
  - r-gam
  - r-inline
  - r-rcpp
  - r-rcppgsl
  - r-ggplot2
  - r-foreach
  - r-iterators

  # ----------------------------------------------------------------------------
  # Python Core Libraries & Data Structures (Conda)
  # ----------------------------------------------------------------------------
  - pysam=0.22.1
  - pyyaml=6.0.3
  - numpy=2.5.1
  - scipy=1.18.0
  - polars=1.43.2
  - pydantic=2.13.4
  - click=8.4.2
  - rich=15.0.0
  - plotly=6.9.0
  - pytest=9.1.1
  - tqdm=4.70.0

  # ----------------------------------------------------------------------------
  # Graphical HUD & Additional Pip Packages
  # ----------------------------------------------------------------------------
  - pip:
      - streamlit==1.65.0
      - pandas==3.0.6
      - altair==6.3.0
      - watchdog==6.0.0
      - pydeck==0.9.3
      - toml==0.10.2
      - anyio==4.15.1
      - httptools==0.9.0
      - uvicorn==0.54.0