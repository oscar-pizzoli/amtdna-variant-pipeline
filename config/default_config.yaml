# ==============================================================================
# PIPELINE CONFIGURATION: ANCIENT & MODERN mtDNA CONSENSUS & AUTHENTICATION
# ==============================================================================

project:
  name: "ancient-modern-mtdna-pipeline"
  version: "1.0.0"
  description: "End-to-end pipeline for ancient and modern mtDNA consensus, damage authentication and haplogrouping"

resources:
  threads: 8
  max_memory_gb: 16
  cpu_budget_fraction: 0.50
  host_cores_override: null

input:
  data_type: "FASTQ"
  input_dir: "data/raw_fastq"
  pattern_r1: "*.fastq.gz"
  pattern_r2: ""
  single_end: true
  allow_missing_mates: false

integrity:
  mode: "fast"

reference:
  fasta_path: "data/reference/rCRS.fasta"
  expected_contig: "NC_012920.1"
  strict_contig: true
  expected_length: 16569
  expected_sequence_md5: null
  is_circular: true
  allow_n: true
  auto_index: true

preprocessing:
  tool: "AdapterRemoval"
  min_read_length: 30
  min_merge_overlap: 11
  collapse_reads: true
  trim_ns: true

alignment:
  aligner: "bwa-aln"
  threads: 4
  parallel_aln: true
  keep_temporary_sai: false
  keep_raw_merged_bam: true
  cleanup_on_failure: true

  bwa_aln:
    seed_length: 1000
    max_diff: 0.01
    max_gap_opens: 2
    max_gap_extensions: -1
    trim_quality_threshold: 0

  read_group:
    platform: "ILLUMINA"
    center: "LAB"

deduplication:
  mode: "both"
  use_csi: false
  threads: 4

filtering:
  fast_mode: false
  multimapping:
    min_mapq: 30
    filter_unmapped: true
    filter_secondary: true
    filter_supplementary: true
    inspect_mapper_tags: false

  thresholds:
    min_breadth_3x_fraction: 0.80
    max_duplication_rate_fraction: 0.85
    min_mean_depth: 3.0

damage:
  policy_id: "adna_standard_v1"
  input_bam_type: "FILTERED_DEDUP"
  allow_input_bam_fallback: false
  library_treatment: "NONE"

  execution:
    terminal_positions_to_profile: 25
    threads: 4

    rescaling:
      enabled: true

    pmd:
      enabled: true
      filtering_enabled: false
      threshold: 3.0
      require_pmd_success: false

  thresholds:
    sampling_power:
      min_c_to_t_5p_observations: 50
      min_g_to_a_3p_observations: 50
      min_reads_for_damage_model: 100

    terminal_deamination:
      min_c_to_t_5p_strong: 0.10
      min_g_to_a_3p_strong: 0.10
      min_c_to_t_5p_moderate: 0.03
      min_g_to_a_3p_moderate: 0.03
      terminal_asymmetry_max_diff: 0.15

    fragmentation:
      max_median_length_bp: 80

    bayesian_model:
      delta_s_strong: 0.20
      delta_s_moderate: 0.05

    pmd_corroboration:
      min_fraction_ge_3: 0.10

    udg_diagnostics:
      partial_max_pos2_to_pos1_ratio: 0.70
      partial_min_pos2_damage_floor: 0.03

contamination:
  enabled: true
  method: "SCHMUTZI"
  allow_fallback_to_dissent: false

  fast_screening:
    enabled: true
    algorithm_version: "fast-screen-v2.0"
    diagnostic_panel_path: "data/reference/diagnostic_sites_phylotree17.tsv"
    diagnostic_panel_version: "phylotree17_v1"
    escalate_dissenting_sites_min: 3
    escalate_vaf_threshold: 0.02
    min_alt_reads_per_site: 2
    min_depth_for_screen: 10.0
    min_genome_depth: 10.0
    min_evaluated_sites: 50
    min_panel_evaluation_fraction: 0.25
    min_base_quality: 30
    min_mapping_quality: 30
    min_depth_per_site: 10
    noise_vaf_floor: 0.015
    cache_screen_results: true
    cache_mode: "strict"

    panel_builder:
      min_maf: 0.02
      min_total_observations: 10.0
      min_panel_size: 10

  subsampling:
    enabled: true
    target_depth: 40.0
    seed: 42
    min_depth_threshold: 42.0

  schmutzi:
    database_path: "data/reference/schmutzi_db/197"
    threads: 2
    max_iterations: 10
    library_treatment: "NONE"
    use_wrapped_reference: false
    use_container: "auto"
    container_engine: "docker"
    container_image: "quay.io/biocontainers/schmutzi:1.5.6--h9a82719_1"

  dissent:
    min_base_quality: 30
    min_mapping_quality: 30
    min_depth_per_site: 10
    noise_vaf_floor: 0.015
    base_min_dissenting_sites: 3
    dissent_high_confidence_min_sites: 50

  thresholds:
    low_threshold: 0.02
    moderate_threshold: 0.05
    elevated_threshold: 0.10
    min_coverage_for_estimation: 5.0
    recommended_coverage: 10.0
    high_confidence_max_ci_width: 0.04
    moderate_confidence_max_ci_width: 0.08
    min_informative_sites: 10
    pmd_filtering_threshold: 3.0

consensus:
  policy_id: "consensus_strict_v1"
  policy_version: "1.0.0"

  min_base_quality: 30
  min_mapping_quality: 30

  min_consensus_depth: 10
  major_allele_fraction: 0.80
  ambiguity_min_vaf: 0.10
  emit_iupac_fasta: true
  emit_subconsensus_vcf: true     # <-- Parametro introdotto per il doppio VCF (Operativo + Sub-consenso)
  mask_char: "N"

  heteroplasmy:
    enabled: true
    min_depth: 15
    min_alt_reads: 3
    min_vaf: 0.10
    max_vaf: 0.80
    strand_bias_alpha: 0.05
    strand_bias_min_strand_reads: 1

    # Spatial Damage Authentication Thresholds
    min_internal_fragments: 2
    spatial_thresholds:
      NON_UDG: 5
      UDG_HALF: 2
      UDG_FULL: 0

  restricted_heteroplasmy:
    min_depth: 20
    min_alt_reads: 5
    min_vaf: 0.25
    max_vaf: 0.75

  regions:
    hvs1_start: 16024
    hvs1_end: 16383
    hvs2_start: 73
    hvs2_end: 340

haplogroup:
  tool: "haplogrep3"
  tree_id: "phylotree-fu-rcrs"
  tree_version: "1.2"
  metric: "KULCZYNSKI"
  min_quality_score: 0.80
  cross_check_vcf: true
  timeout_seconds: 300
  retain_raw_output: true

validation:
  sequence_type: "CANONICAL"
  max_n_percentage: 15.0

cross_block_audit:
  min_quality_score: 0.80
  max_missing_diagnostic_mutations: 2
  max_private_mutations: 5
  contam_affinity_threshold: 0.015
  subclade_contam_max_fraction: 0.03
  evaluate_contaminant_closeness: true
  flag_damage_in_private_mutations: true

output:
  results_dir: "results"
  save_intermediate_bams: false
  compress_outputs: true